    <!-- Critical inline CSS for above-the-fold content -->
    <style>
      /* Inter font with font-display: swap */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyeMZs.woff2') format('woff2');
      }
      
      /* Critical above-the-fold styles */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 193 55% 58%;
        --primary-foreground: 0 0% 100%;
        --secondary: 20 93% 54%;
        --secondary-foreground: 0 0% 100%;
        --muted: 210 40% 96.1%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --border: 214.3 31.8% 91.4%;
        --radius: 0.5rem;
      }
      
      * { box-sizing: border-box; }
      
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.5;
      }
      
      .hero-container {
        min-height: 100vh;
        background: hsl(var(--background));
      }
      
      .sticky-header-space {
        height: 60px; /* Reserve space for sticky header to prevent CLS */
      }
      
      .btn-cta {
        background: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: opacity 0.2s;
      }
      
      .btn-cta:hover {
        opacity: 0.9;
      }
      
      .btn-secondary {
        background: hsl(var(--secondary));
        color: hsl(var(--secondary-foreground));
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: opacity 0.2s;
      }
      
      .btn-secondary:hover {
        opacity: 0.9;
      }
    </style>
