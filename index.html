    <meta charset="UTF-8" />

    <!-- Preload critical LCP image -->
    <link rel="preload" as="image" href="/assets/hero-background-new.webp" type="image/webp" imagesrcset="/assets/hero-background-new.webp 1920w" imagesizes="100vw" fetchpriority="high">

    <!-- Preconnect to performance-critical origins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://koubtooblwjcwubcuhml.supabase.co">
    <link rel="preconnect" href="https://fast.wistia.com">
    <link rel="preconnect" href="https://img.youtube.com">
    
    <!-- Critical inline CSS for above-the-fold content -->
    <style>
      /* Inter font with font-display: swap */
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('https://fonts.gstatic.com/s/inter/v13/UcCO3FwrK3iLTeHuS_fvQtMwCp50KnMw2boKoduKmMEVuLyeMZs.woff2') format('woff2');
      }
      
      /* Critical above-the-fold styles */
      :root {
        --background: 0 0% 100%;
        --foreground: 222.2 84% 4.9%;
        --primary: 193 55% 58%;
        --primary-foreground: 0 0% 100%;
        --secondary: 20 93% 54%;
        --secondary-foreground: 0 0% 100%;
        --muted: 210 40% 96.1%;
        --muted-foreground: 215.4 16.3% 46.9%;
        --border: 214.3 31.8% 91.4%;
        --radius: 0.5rem;
      }
      
      * { box-sizing: border-box; }
      
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        margin: 0;
        padding: 0;
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        line-height: 1.5;
      }
      
      .hero-container {
        min-height: 100vh;
        background: hsl(var(--background));
      }
      
      .sticky-header-space {
        height: 60px; /* Reserve space for sticky header to prevent CLS */
      }
      
      .btn-cta {
        background: hsl(var(--primary));
        color: hsl(var(--primary-foreground));
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: opacity 0.2s;
      }
      
      .btn-cta:hover {
        opacity: 0.9;
      }
      
      .btn-secondary {
        background: hsl(var(--secondary));
        color: hsl(var(--secondary-foreground));
        padding: 0.75rem 1.5rem;
        border-radius: var(--radius);
        text-decoration: none;
        font-weight: 600;
        display: inline-block;
        transition: opacity 0.2s;
      }
      
      .btn-secondary:hover {
        opacity: 0.9;
      }
    </style>
    
    <!-- Preload and defer non-critical CSS -->
    <link rel="preload" as="style" href="/src/index.css" onload="this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="/src/index.css"></noscript>
    
    <title>FORMULA The #1 Agency Growth Event Returns in 2026</title>

    <link rel="apple-touch-icon" href="/assets/logo.png">

    <meta name="twitter:card" content="summary_large_image">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Formula Forum 2026 — Insurance Agency Growth Conference in Orlando">
    <meta name="twitter:title" content="Formula Forum 2026 — Insurance Agency Growth Conference in Orlando">
    <meta property="og:description" content="Formula Forum 2026: the national insurance agency growth conference. Oct 14–16 at JW Marriott Orlando Bonnet Creek. Workshops, breakouts, and a 90-day growth plan.">
    <meta name="twitter:description" content="Formula Forum 2026: the national insurance agency growth conference. Oct 14–16 at JW Marriott Orlando Bonnet Creek. Workshops, breakouts, and a 90-day growth plan.">
    <meta property="og:image" content="https://f3florida.com/assets/hero-1200x630.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
</head>
