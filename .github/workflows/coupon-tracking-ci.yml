name: Coupon tracking CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coupon-tracking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify resource partner mapping
        run: npm run formula:resources:audit

      - name: Build application
        run: npm run build

      - name: Lint admin pages
        run: npx eslint src/pages/AdminSales.tsx src/pages/AdminFormulaAttendees.tsx src/pages/AdminAuth.tsx src/components/admin/AttendeePasswordReset.tsx src/lib/adminAttendeePassword.ts

      - name: Test attendee password reset client
        run: npm run test:admin-password

      - name: Lint AI portal pages
        run: npx eslint src/pages/AIPortal.tsx src/lib/aiPortal.ts src/pages/AdminAIPortal.tsx src/lib/aiPortalAdmin.ts

      - name: Test AI portal clients
        run: npm run test:ai-portal && npm run test:ai-portal-admin

      - name: Verify attendee partner SQL contract locally
        run: |
          npm install --prefix "$RUNNER_TEMP/formula-partner-sql-test" --no-save --package-lock=false @electric-sql/pglite@0.5.8
          FORMULA_PGLITE_ROOT="$RUNNER_TEMP/formula-partner-sql-test/node_modules/@electric-sql/pglite" node scripts/testAttendeePartnerAssignment.mjs

  edge-functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js dependencies used by TypeScript
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install TypeScript type dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check attendee admin function
        run: deno check supabase/functions/formula-admin-attendees/index.ts

      - name: Type-check Stripe webhook
        run: deno check supabase/functions/stripe-webhook-enhanced/index.ts

      - name: Type-check Stripe reconciliation
        run: deno check supabase/functions/reconcile-stripe-purchases/index.ts

      - name: Type-check AI portal functions
        run: deno check supabase/functions/formula-ai-portal-signin/index.ts supabase/functions/formula-ai-portal/index.ts supabase/functions/formula-ai-portal-admin/index.ts

      - name: Test coupon response parsing
        run: deno test supabase/functions/_shared/stripe-coupons.test.ts
