name: Coupon tracking CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: coupon-tracking-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Lint coupon admin page
        run: npx eslint src/pages/AdminSales.tsx

  edge-functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js dependencies used by TypeScript
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install TypeScript type dependencies
        run: npm ci

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Stripe webhook
        run: deno check supabase/functions/stripe-webhook-enhanced/index.ts

      - name: Type-check Stripe reconciliation
        run: deno check supabase/functions/reconcile-stripe-purchases/index.ts

      - name: Test coupon response parsing
        run: deno test supabase/functions/_shared/stripe-coupons.test.ts
